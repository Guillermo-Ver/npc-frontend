<section class="py-5 bg-black" id="shop-section">
    <div class="container">
        <h2 class="text-white mb-5 text-center">&gt; WEEKLY_OFFERS</h2>

        @if (loading) {
        <div class="col-12 text-center py-5">
            <p class="text-primary blink">> WAITING_FOR_SERVER_RESPONSE...</p>
        </div>
        } @else {
        <div class="row g-4">
            @for (product of products; track product.id) {
            <div class="col-md-3">
                <div [routerLink]="['/drop', product.id]" class="card product-card h-100"
                    style="cursor: pointer; transition: border-color 0.3s ease;">
                    <div class="card-header-tech">
                        <span>{{ product.tag }}</span>
                        <span>ID:00{{ product.id }}</span>
                    </div>
                    <div class="img-container">
                        <img [src]="product.imageUrl" class="card-img-top" alt="{{ product.name }}">
                    </div>
                    <div class="card-body bg-black border-top border-secondary d-flex flex-column">
                        <h5 class="card-title text-white text-truncate">{{ product.name }}</h5>
                        <p class="card-text text-muted small flex-grow-1">{{ product.description }}</p>

                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-dark">
                            <span class="price-tag">{{ product.price }}€</span>
                            <span class="text-primary blink-hover" style="font-family: 'VT323'; font-size: 1.2rem;">>
                                VIEW_</span>
                        </div>
                    </div>
                </div>
            </div>
            } @empty {
            <div class="col-12 text-center py-5">
                <p class="text-danger">> NO_INVENTORY_FOUND</p>
            </div>
            }
        </div>
        }
    </div>
</section>
